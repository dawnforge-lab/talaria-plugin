name: talaria_push
manifest_version: 1
version: 1.0.0
description: "Send Hermes lifecycle notifications to Talaria devices."
author: Talaria
kind: standalone
platforms:
  - linux
  - macos
  - windows
provides_hooks:
  - pre_tool_call
  - post_llm_call
  - on_session_end
  - pre_approval_request
  - subagent_start
  - subagent_stop
  - pre_llm_call
  - post_approval_response
  - pre_api_request
  - post_api_request
provides_tools:
  - talaria_call_user
  - talaria_call_watch
  - talaria_watch_report
  - talaria_settings
  - talaria_present
  - talaria_show
  - talaria_health
  - talaria_location
  - talaria_maps
  - talaria_calendar
  - talaria_phone
  - talaria_contacts
provides_middleware:
  - tool_execution
